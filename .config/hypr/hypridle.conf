general {
    lock_cmd = hyprlock
}

listener {
    timeout = 300 # 5 minutes
    on-timeout = hyprlock
}

listener {
    timeout = 330 # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 7200 # 2 hours
    on-timeout = systemctl suspend
    on-resume = hyprctl dispatch dpms on
}
