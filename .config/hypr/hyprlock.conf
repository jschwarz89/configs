#source = /home/john/.config/hypr/hyprland.conf

# BACKGROUND
background {
    monitor =
    path = /home/john/.config/hypr/lock.png
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    #no_fade_in = true
    #no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    #font_color = $foreground
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <span foreground="##cdd6f4">$USER</span>
    fail_text = <span foreground="##000000">$FAIL <b>($ATTEMPTS)</b></span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%-I:%M:%S")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}

# KEYBOARD LAYOUT
label {
	monitor =
	text = cmd[update:1000] hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap'
	#color = $foreground
	font_size = 12
	font_family = JetBrains Mono
	position = -200, -200
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:1000] python -c "print('Battery:', int(int(open('/sys/class/power_supply/BAT0/energy_now').read()) / int(open('/sys/class/power_supply/BAT0/energy_full').read()) * 100))"
	#color = $foreground
	font_size = 16
	font_family = JetBrains Mono
	position = -15, -10
	halign = right
	valign = top
}
